name: Build SM80 CUDA image (ghcr)

# Builds the DeepSeek-V4.1 SM80 (A100/A800) serving image from this branch and
# pushes it to GitHub Container Registry:
#   ghcr.io/zenglanmu/vllm:dsv4-ampere
#
# The image is `docker/Dockerfile`'s vllm-openai target, compiled only for
# sm_80 with the port's minimal build (no SM90/SM100 external projects, FA3 is
# skipped automatically when the arch list has no SM90). FA2 is built unless
# the `skip_flash_attn` input is set; a text-only image needs
# `MM_ATTN_BACKEND=TRITON_ATTN` for the ViT.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish in addition to the commit tag"
        default: dsv4-ampere
      skip_flash_attn:
        description: "Build a text-only wheel (no FA2; ViT needs TRITON_ATTN)"
        type: boolean
        default: false
  push:
    branches: [dsv4-ampere]
    paths:
      - ".github/workflows/build-ghcr.yml"
      - "CMakeLists.txt"
      - "csrc/**"
      - "docker/Dockerfile"
      - "requirements/**"
      - "setup.py"
      - "vllm/**"

concurrency:
  group: sm80-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # 4-core hosted runner; the vLLM wheel for one arch takes ~1-2 h.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: vllm-openai
          push: true
          provenance: false
          build-args: |
            CUDA_VERSION=13.0.3
            torch_cuda_arch_list=8.0
            VLLM_SM80_MINIMAL_BUILD=1
            VLLM_SKIP_FLASH_ATTN=${{ inputs.skip_flash_attn && '1' || '' }}
            max_jobs=2
            nvcc_threads=4
          tags: |
            ${{ env.IMAGE }}:${{ inputs.image_tag || 'dsv4-ampere' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
